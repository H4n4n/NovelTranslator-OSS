[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "noveltranslator"
version = "0.1.0"
description = "Multi-novel CJK-to-English translation and publication pipeline"
requires-python = ">=3.14,<3.15"
dependencies = [
    "openai==3.3.1",
    "python-dotenv==1.2.3",
    "EbookLib==0.20",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools]
py-modules = []
