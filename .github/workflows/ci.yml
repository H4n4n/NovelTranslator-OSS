name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    name: Publication allowlist guard
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      tier: ${{ steps.decision.outputs.tier }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Isolate TEMP/TMP to the runner temp root
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify forbidden paths and credentials are absent
        shell: pwsh
        run: |
          foreach ($d in @('novels','data','backup','backups','incoming','.commandcode')) {
            if (Test-Path $d) { throw "Forbidden private directory present: $d" }
          }
          if (Test-Path '.env') { throw "A repository .env file must not exist." }
          if ($env:DEEPSEEK_API_KEY) { throw "DEEPSEEK_API_KEY must not be available in CI." }
          if ($env:OPENAI_API_KEY) { throw "OPENAI_API_KEY must not be available in CI." }
          if ($env:ANTHROPIC_API_KEY) { throw "ANTHROPIC_API_KEY must not be available in CI." }
          Write-Host "Private-path and provider-credential guards: GOOD"

      - name: Run fail-closed publication guard
        run: python scripts/publication_guard.py --push-check

      - name: Decide exact source-bound qualification
        id: decision
        run: python scripts/public_ci.py decide --directory "${{ runner.temp }}/qualification"

      - name: Retain guard and decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: public-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification/*.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Windows Python 3.14.4 zero-provider (shard ${{ matrix.shard }})
    needs: guard
    if: needs.guard.outputs.tier == 'L3'
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Isolate TEMP/TMP to the runner temp root
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assert provider credentials are unavailable to tests
        shell: pwsh
        run: |
          if ($env:DEEPSEEK_API_KEY) { throw "DEEPSEEK_API_KEY must not be available in CI." }
          if ($env:OPENAI_API_KEY) { throw "OPENAI_API_KEY must not be available in CI." }
          if ($env:ANTHROPIC_API_KEY) { throw "ANTHROPIC_API_KEY must not be available in CI." }
          if (Test-Path '.env') { throw "A repository .env file must not exist." }
          Write-Host "Provider credential guard: GOOD"

      - name: Install pinned dependencies (package index only; no provider traffic)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static compilation (failure propagates)
        run: python -m compileall -q .

      - name: Download exact run decision
        uses: actions/download-artifact@v4
        with:
          name: public-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification

      - name: Run guarded public test shard
        run: python scripts/run_public_tests.py --decision "${{ runner.temp }}/qualification/decision.json" --shards 4 --shard ${{ matrix.shard }} --timeout-seconds 4500 --diagnostics "${{ runner.temp }}/public-ci-${{ matrix.shard }}"

      - name: Assert tracked source cleanliness
        if: always()
        shell: pwsh
        run: |
          $state = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $state) { throw "Tracked source changed during validation." }

      - name: Retain bounded public timing and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/public-ci-${{ matrix.shard }}/*.json*
          if-no-files-found: error
          retention-days: 14

  l1:
    name: L1 guarded smoke
    needs: guard
    if: needs.guard.outputs.tier == 'L1'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Isolate TEMP/TMP to the runner temp root
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assert provider credentials are unavailable to tests
        shell: pwsh
        run: |
          if ($env:DEEPSEEK_API_KEY) { throw "DEEPSEEK_API_KEY must not be available in CI." }
          if ($env:OPENAI_API_KEY) { throw "OPENAI_API_KEY must not be available in CI." }
          if ($env:ANTHROPIC_API_KEY) { throw "ANTHROPIC_API_KEY must not be available in CI." }
          if (Test-Path '.env') { throw "A repository .env file must not exist." }
          Write-Host "Provider credential guard: GOOD"

      - name: Install pinned dependencies (package index only; no provider traffic)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static compilation (failure propagates)
        run: python -m compileall -q .

      - name: Download exact run decision
        uses: actions/download-artifact@v4
        with:
          name: public-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification

      - name: Run guarded public test shard
        run: python scripts/run_public_tests.py --decision "${{ runner.temp }}/qualification/decision.json" --shards 1 --shard 0 --timeout-seconds 4500 --diagnostics "${{ runner.temp }}/public-ci-0"

      - name: Assert tracked source cleanliness
        if: always()
        shell: pwsh
        run: |
          $state = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $state) { throw "Tracked source changed during validation." }

      - name: Retain bounded public timing and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ci-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: ${{ runner.temp }}/public-ci-0/*.json*
          if-no-files-found: error
          retention-days: 14

  l2:
    name: L2 guarded affected tests
    needs: guard
    if: needs.guard.outputs.tier == 'L2'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Isolate TEMP/TMP to the runner temp root
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Assert provider credentials are unavailable to tests
        shell: pwsh
        run: |
          if ($env:DEEPSEEK_API_KEY) { throw "DEEPSEEK_API_KEY must not be available in CI." }
          if ($env:OPENAI_API_KEY) { throw "OPENAI_API_KEY must not be available in CI." }
          if ($env:ANTHROPIC_API_KEY) { throw "ANTHROPIC_API_KEY must not be available in CI." }
          if (Test-Path '.env') { throw "A repository .env file must not exist." }
          Write-Host "Provider credential guard: GOOD"

      - name: Install pinned dependencies (package index only; no provider traffic)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Static compilation (failure propagates)
        run: python -m compileall -q .

      - name: Download exact run decision
        uses: actions/download-artifact@v4
        with:
          name: public-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification

      - name: Run guarded public test shard
        run: python scripts/run_public_tests.py --decision "${{ runner.temp }}/qualification/decision.json" --shards 1 --shard 0 --timeout-seconds 4500 --diagnostics "${{ runner.temp }}/public-ci-0"

      - name: Assert tracked source cleanliness
        if: always()
        shell: pwsh
        run: |
          $state = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $state) { throw "Tracked source changed during validation." }

      - name: Retain bounded public timing and coverage diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-ci-${{ github.run_id }}-${{ github.run_attempt }}-0
          path: ${{ runner.temp }}/public-ci-0/*.json*
          if-no-files-found: error
          retention-days: 14

  gate:
    name: Public CI gate
    if: always()
    needs: [guard, l1, l2, test]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout exact tested merge
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.14.4
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.4'

      - name: Isolate TEMP/TMP to the runner temp root
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download required guard evidence
        uses: actions/download-artifact@v4
        with:
          name: public-decision-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification

      - name: Download exact-attempt test evidence
        uses: actions/download-artifact@v4
        with:
          pattern: public-ci-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/downloaded

      - name: Read current PR identity (read-only GitHub API)
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            let live = {};
            if (context.eventName === 'pull_request') {
              const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: context.issue.number});
              live = {number: pr.number, state: pr.state, head: {sha: pr.head.sha},
                      base: {sha: pr.base.sha}, merge_commit_sha: pr.merge_commit_sha};
            }
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'live-pr.json'), JSON.stringify(live));

      - name: Recompute decision and reconcile all required results and telemetry
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        shell: pwsh
        run: |
          python scripts/public_ci.py gate --directory "$env:RUNNER_TEMP/qualification" --needs "$env:JOB_RESULTS" --live "$env:RUNNER_TEMP/live-pr.json" --evidence "$env:RUNNER_TEMP/downloaded"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert gate source cleanliness
        if: always()
        shell: pwsh
        run: |
          $state = git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $state) { throw "Tracked source changed during validation." }
